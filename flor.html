</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;


// =====================================================
// ESCALA
// =====================================================

const escala = 1.0;


// =====================================================
// SISTEMA DE COORDENADAS
// =====================================================

let centroX = canvas.width / 2;
let centroY = canvas.height / 2;


function canvasX(x) {
    return centroX + x * escala;
}


function canvasY(y) {
    return centroY - y * escala;
}


// =====================================================
// COLORES
// =====================================================

const naranja = "#FFA216";
const cafe = "#884513";


// =====================================================
// TURTLE
// =====================================================

let turtleX = 0;
let turtleY = -40;
let heading = 0;


function rt(grados) {
    heading -= grados;
}


function lt(grados) {
    heading += grados;
}


// =====================================================
// GUARDAR LÍNEAS DE LAS HOJAS
// =====================================================

let hojas = [];


function guardarCircle(radius, extent) {

    let h = heading * Math.PI / 180;

    let centerXLocal =
        turtleX - Math.sin(h) * radius;

    let centerYLocal =
        turtleY + Math.cos(h) * radius;

    let startAngle =
        Math.atan2(
            turtleY - centerYLocal,
            turtleX - centerXLocal
        );

    const pasos =
        Math.max(8, Math.ceil(Math.abs(extent) / 3));

    let anteriorX = turtleX;
    let anteriorY = turtleY;


    for (let i = 1; i <= pasos; i++) {

        let porcentaje = i / pasos;

        let angulo =
            startAngle +
            extent * Math.PI / 180 * porcentaje;

        let nuevoX =
            centerXLocal +
            radius * Math.cos(angulo);

        let nuevoY =
            centerYLocal +
            radius * Math.sin(angulo);


        hojas.push({
            x1: anteriorX,
            y1: anteriorY,
            x2: nuevoX,
            y2: nuevoY
        });


        anteriorX = nuevoX;
        anteriorY = nuevoY;
    }


    turtleX = anteriorX;
    turtleY = anteriorY;


    let direccionTangente =
        startAngle +
        extent * Math.PI / 180;

    let signo = extent >= 0 ? 1 : -1;

    heading =
        direccionTangente * 180 / Math.PI +
        signo * 90;
}


// =====================================================
// CREAR HOJAS
// =====================================================

function crearHojas() {

    turtleX = 0;
    turtleY = -40;
    heading = 0;


    for (let i = 0; i < 15; i++) {

        for (let j = 0; j < 17; j++) {

            rt(90);

            guardarCircle(
                150 - j * 6,
                90
            );


            lt(90);

            guardarCircle(
                150 - j * 6,
                90
            );


            rt(180);

            guardarCircle(
                40,
                24
            );
        }
    }
}


crearHojas();


// =====================================================
// PUNTOS CAFÉS
// =====================================================
//
// 800 puntos, pero dentro del mismo margen aproximado
// que tenían los 140 puntos originales.
//
// Radio máximo original:
// 4 * sqrt(139) ≈ 47
//
// Ahora usamos un radio máximo de aproximadamente 47.
// =====================================================

let puntosCafe = [];

const golden_ang = 137.508;

const phi =
    golden_ang * Math.PI / 180;


// Cantidad de puntos
const cantidadPuntos = 800;


// Radio máximo
const radioMaximo = 50;


for (let i = 0; i < cantidadPuntos; i++) {

    // Distribución uniforme dentro del mismo margen
    const r =
        radioMaximo *
        Math.sqrt(i / cantidadPuntos);

    const theta =
        i * phi;


    const x =
        r * Math.cos(theta);

    const y =
        r * Math.sin(theta);


    puntosCafe.push({
        x: x,
        y: y
    });
}


// =====================================================
// LETRA A
// =====================================================

let posicionesA = [];


function crearA(x, y) {

    const positions_a = [

        // Lado izquierdo
        [x, y],
        [x + 3, y + 6],
        [x + 6, y + 12],
        [x + 9, y + 18],
        [x + 12, y + 24],
        [x + 15, y + 30],
        [x + 18, y + 36],
        [x + 21, y + 42],
        [x + 24, y + 48],
        [x + 30, y + 52],

        // Lado derecho
        [x + 36, y + 48],
        [x + 39, y + 42],
        [x + 42, y + 36],
        [x + 45, y + 30],
        [x + 48, y + 24],
        [x + 51, y + 18],
        [x + 54, y + 12],
        [x + 57, y + 6],
        [x + 60, y],

        // Barra central
        [x + 18, y + 24],
        [x + 24, y + 24],
        [x + 30, y + 24],
        [x + 35, y + 24],
        [x + 42, y + 24]
    ];


    for (const pos of positions_a) {

        posicionesA.push({
            x: pos[0],
            y: pos[1]
        });
    }
}


crearA(-30, -20);


// =====================================================
// DIBUJAR HOJAS
// =====================================================

function dibujarHojas(cantidad) {

    ctx.strokeStyle = naranja;
    ctx.lineWidth = 1;


    for (
        let i = 0;
        i < cantidad && i < hojas.length;
        i++
    ) {

        const linea = hojas[i];


        ctx.beginPath();

        ctx.moveTo(
            canvasX(linea.x1),
            canvasY(linea.y1)
        );

        ctx.lineTo(
            canvasX(linea.x2),
            canvasY(linea.y2)
        );

        ctx.stroke();
    }
}


// =====================================================
// DIBUJAR PUNTOS CAFÉS
// =====================================================

function dibujarPuntos(cantidad) {

    ctx.fillStyle = cafe;


    for (
        let i = 0;
        i < cantidad && i < puntosCafe.length;
        i++
    ) {

        const punto = puntosCafe[i];


        ctx.beginPath();

        ctx.arc(
            canvasX(punto.x),
            canvasY(punto.y),
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}


// =====================================================
// DIBUJAR A
// =====================================================

function dibujarA(cantidad) {

    ctx.fillStyle = naranja;

    ctx.strokeStyle = "black";

    ctx.lineWidth = 1;


    for (
        let i = 0;
        i < cantidad && i < posicionesA.length;
        i++
    ) {

        const punto = posicionesA[i];


        ctx.beginPath();

        ctx.arc(
            canvasX(punto.x),
            canvasY(punto.y),
            4,
            0,
            Math.PI * 2
        );


        ctx.fill();

        ctx.stroke();
    }
}


// =====================================================
// ANIMACIÓN
// =====================================================

let hojasActuales = 0;

let puntosActuales = 0;

let puntosAActuales = 0;

let etapa = 0;


// =====================================================
// VELOCIDADES
// =====================================================

const velocidadHojas = 25;

const velocidadCafe = 8;

const velocidadA = 1;


// =====================================================
// FUNCIÓN DE ANIMACIÓN
// =====================================================

function animar() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // =================================================
    // ETAPA 1 - HOJAS
    // =================================================

    if (etapa === 0) {

        hojasActuales += velocidadHojas;


        if (hojasActuales >= hojas.length) {

            hojasActuales = hojas.length;

            etapa = 1;
        }
    }


    // =================================================
    // ETAPA 2 - PUNTOS CAFÉS
    // =================================================

    else if (etapa === 1) {

        puntosActuales += velocidadCafe;


        if (puntosActuales >= puntosCafe.length) {

            puntosActuales = puntosCafe.length;

            etapa = 2;
        }
    }


    // =================================================
    // ETAPA 3 - LETRA A
    // =================================================

    else if (etapa === 2) {

        puntosAActuales += velocidadA;


        if (puntosAActuales >= posicionesA.length) {

            puntosAActuales = posicionesA.length;

            etapa = 3;
        }
    }


    // =================================================
    // ORDEN DE DIBUJO
    // =================================================

    // Hojas primero
    dibujarHojas(hojasActuales);


    // Puntos cafés después
    dibujarPuntos(puntosActuales);


    // A al final
    dibujarA(puntosAActuales);


    requestAnimationFrame(animar);
}


// =====================================================
// INICIAR
// =====================================================

animar();


// =====================================================
// REDIMENSIONAR
// =====================================================

window.addEventListener("resize", () => {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    centroX = canvas.width / 2;
    centroY = canvas.height / 2;
});

</script>

</body>
</html>
